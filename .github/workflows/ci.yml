name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: node ${{ matrix.node }} · graphql 16
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: npm pack --dry-run

  graphql-17:
    name: node 22 · graphql 17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Apollo Server 5 supports graphql 16 only, so its tests are skipped here.
      - run: npm install --no-save --force graphql@^17.1.0
      - run: npx vitest run --exclude test/apollo.test.ts --exclude test/attacks-plugins.test.ts
      - run: npm run build
      - run: node scripts/smoke.mjs
