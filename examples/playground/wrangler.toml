# Bundling config for the Pages deploy (see worker.ts); not deployed as a Worker itself.
name = "fareql-playground"
main = "worker.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

[alias]
"@modelcontextprotocol/sdk/types.js" = "./stubs/optional.ts"
